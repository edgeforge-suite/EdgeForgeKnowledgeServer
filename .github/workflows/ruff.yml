name: Ruff

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    name: ruff lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Ruff advisory check
        run: |
          set +e
          output="$(python -m ruff check . 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "::warning title=Ruff advisory findings::Ruff reported advisory lint findings; see log output for details."
              echo "$output"
            }
            exit 0
          fi
          echo "$output"
