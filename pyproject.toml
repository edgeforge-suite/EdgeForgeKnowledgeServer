[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeforge-knowledge-server"
version = "4.1.0"
description = "EdgeForge Phase 5 Knowledge Server MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Santosh Hommaradi" },
]
maintainers = [
  { name = "Santosh Hommaradi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastmcp==3.4.11",
  "pydantic>=2.0.0",
]

[project.urls]
Documentation = "https://github.com/edgeforge-suite/EdgeForgeKnowledgeServer#readme"
Source = "https://github.com/edgeforge-suite/EdgeForgeKnowledgeServer"

[project.scripts]
edgeforge-ks = "knowledge_server.server:main"

[project.optional-dependencies]
excel = [
  "openpyxl>=3.1.0",
]
pdf = [
  "pdfplumber>=0.11.0",
]
docx = [
  "python-docx>=1.1.0",
]
all = [
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
